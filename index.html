<style>
/* Layout: sticky toolbar (month + tabs) → day strip → two shift columns that stack on phones */
:root{
  --bg:#f2f4f6; --surface:#ffffff; --sunk:#e8ecf0; --ink:#16212b; --muted:#5b6977; --line:#d6dde4;
  --accent:#0f5c7a; --accent-ink:#ffffff;
  --morning:#9a5206; --morning-bg:#fcefdc; --night:#353a96; --night-bg:#e8e9fb;
  --ot:#ffd23f; --ot-ink:#2a2000;
  --ok:#17784a; --ok-bg:#ddf2e6; --bad:#b42318; --bad-bg:#fde6e3;
  --f-body:"IBM Plex Sans Thai",system-ui,sans-serif; --f-head:"Prompt","IBM Plex Sans Thai",system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f151b; --surface:#17202a; --sunk:#1e2833; --ink:#e5ecf2; --muted:#93a1ae; --line:#2b3642;
  --accent:#5cb8d8; --accent-ink:#06202b;
  --morning:#f2b155; --morning-bg:#3a2a12; --night:#adb1ff; --night-bg:#24254a;
  --ot:#e8bd2c; --ot-ink:#1a1400; --ok:#62d497; --ok-bg:#12321f; --bad:#ff8a80; --bad-bg:#3d1714; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151b; --surface:#17202a; --sunk:#1e2833; --ink:#e5ecf2; --muted:#93a1ae; --line:#2b3642;
  --accent:#5cb8d8; --accent-ink:#06202b;
  --morning:#f2b155; --morning-bg:#3a2a12; --night:#adb1ff; --night-bg:#24254a;
  --ot:#e8bd2c; --ot-ink:#1a1400; --ok:#62d497; --ok-bg:#12321f; --bad:#ff8a80; --bad-bg:#3d1714; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:0 96px}
h1,h2,h3{font-family:var(--f-head);font-weight:600;margin:0;text-wrap:balance}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;min-height:36px}
button:hover{border-color:var(--accent)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.ghost{background:transparent;border-color:transparent;color:var(--muted)}
button.ghost:hover{color:var(--ink);border-color:var(--line)}
button:disabled{opacity:.45;cursor:not-allowed}
select,input{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-height:36px;min-width:0}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-block:12px 0}
.top-row{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between}
.brand{display:flex;flex-direction:column;gap:0}
.brand h1{font-size:20px}
.brand small{color:var(--muted);font-size:12.5px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tabs{display:flex;gap:4px;margin-top:10px;overflow-x:auto}
.tab{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:8px 14px;color:var(--muted);font-weight:500;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

.banner{margin-top:14px;padding:12px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.banner.warn{background:var(--morning-bg);border-color:transparent}

/* day strip */
.strip{display:flex;gap:6px;overflow-x:auto;padding-block:14px 6px;scrollbar-width:thin}
.chip{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:52px;padding:6px 6px 7px;border-radius:9px;border:1px solid var(--line);background:var(--surface)}
.chip .wd{font-size:11.5px;color:var(--muted)}
.chip .dn{font:600 18px/1.1 var(--f-head)}
.chip .cnt{font-size:11px;color:var(--muted);display:flex;gap:4px}
.chip.we .wd{color:var(--bad)}
.chip.today{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"] .wd,.chip[aria-pressed="true"] .cnt{color:var(--accent-ink)}
.chip .dot{width:6px;height:6px;border-radius:50%;background:var(--ot);display:inline-block;margin-top:2px}

.dayhead{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-block:10px 14px}
.dayhead h2{font-size:22px}
.pills{display:flex;flex-wrap:wrap;gap:6px}

<script>
const TH_M=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const TH_D=['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
const TH_DS=['อา','จ','อ','พ','พฤ','ศ','ส'];
const SH={morning:{label:'กะเช้า',time:'07:00–19:00',xl:'07:00-19:00'},night:{label:'กะดึก',time:'19:00–07:00',xl:'19:00-07:00'}};
const S={months:[],month:null,days:{},emps:[],tab:'day',day:null,unsub:null,loaded:false,pending:null};
let db=null, dl=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const clone=o=>JSON.parse(JSON.stringify(o??null));
const str=v=>v==null?'':String(v).trim();
function toast(msg){const h=$('#toastHost');h.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>h.innerHTML='',2600)}
function monthLabel(id){const [y,m]=id.split('-');return `${TH_M[+m-1]} ${y}`}
function dateOf(dd){const [y,m]=S.month.split('-');return new Date(+y,+m-1,+dd)}
function empKey(name){let h=0;for(const c of name)h=(h*31+c.codePointAt(0))>>>0;return 'e'+h.toString(36)}

/* ---------- persistence ---------- */
const chain={};const busy={};
// While a write to a doc is in flight (plus a short grace), keep the local copy and ignore older snapshots
function isBusy(path){return (busy[path]||0)>0}
function saveDoc(path,data){
  if(!db)return Promise.resolve();
  const copy=JSON.parse(JSON.stringify(data));
  busy[path]=(busy[path]||0)+1;
  chain[path]=(chain[path]||Promise.resolve()).then(()=>db.doc(path).set(copy)).catch(e=>toast('บันทึกไม่สำเร็จ: '+(e?.message||e?.code||e)))
    .finally(()=>setTimeout(()=>{busy[path]--;},1500));
  if(typeof VAN!=='undefined'&&VAN.auto&&path.startsWith(`months/${curMonthId()}/days/`))vanSchedulePush();
  return chain[path];
}
function delDoc(path){if(!db)return;chain[path]=(chain[path]||Promise.resolve()).then(()=>db.doc(path).delete()).catch(e=>toast('ลบไม่สำเร็จ: '+(e?.message||e?.code)))}
function saveDay(dd){const d=S.days[dd];render();return saveDoc(`months/${S.month}/days/${dd}`,d)}
function saveEmp(e){const {id,...rest}=e;render();return saveDoc(`employees/${id}`,rest)}

function selectMonth(id){
  if(S.unsub){S.unsub();S.unsub=null}
  if(id!==S.month){S.days={};S.day=null}
  S.month=id;
  if(!id){render();return}
  if(db){
    S.unsub=db.collection(`months/${id}/days`).onSnapshot(snap=>{
      const days={};snap.docs.forEach(d=>{const p=`months/${id}/days/${d.id}`;days[d.id]=(isBusy(p)&&S.days[d.id])?S.days[d.id]:clone(d.data())});S.days=days;pickDay();render();
    },e=>toast('โหลดข้อมูลไม่ได้: '+e.message));
  }
  render();
}
function pickDay(){
  const keys=Object.keys(S.days).sort();
  if(S.dayWant&&S.dayWant.m===S.month&&S.days[S.dayWant.d]){S.day=S.dayWant.d;return}  // วันที่ผู้ใช้เลือกเอง — ไม่ให้ซิงก์ย้ายไปวันอื่น
  if(S.day&&S.days[S.day])return;
  const now=new Date();const td=`${now.getFullYear()}-${pad(now.getMonth()+1)}`;
  S.day=(td===S.month&&S.days[pad(now.getDate())])?pad(now.getDate()):keys[0]||null;
}

/* ---------- helpers on data ---------- */
function empByName(n){return S.emps.find(e=>e.name===n)}
function empOf(r){return (r.eid&&S.emps.find(e=>e.eid===r.eid))||empByName(r.name)}

/* ---------- เส้นทาง (ย้ายมาจาก build_routes.py) ---------- */
// พิกัดเริ่มต้นของพนักงาน (จาก Google My Maps "บ้านพนักงาน TPAC") — ใช้เติมให้คนที่ยังไม่มีพิกัด
const SEED=[];
const SEED_NORIDE={};
const ROUTE_DEF={startName:'จุดจอดรถ',start:'',endName:'โรงงาน',end:'',
  market:'',marketDow:0,marketOn:true,arrM:'05:50',arrN:'17:50',leaveM:'07:10',leaveN:'19:10',speed:40,stop:1.5,rf:1.3,
  prec:[]};
S.route={...ROUTE_DEF};
const MORNING_C=new Set(['1','1OT','M','MOT','D']),NIGHT_C=new Set(['2','2OT','N','NOT']);
// รับ "12.67, 101.27" หรือ ลิงก์ Google Maps แบบยาว (@lat,lng / q=lat,lng / !3d..!4d..)
function parseLL(s){s=String(s||'').trim();if(!s)return null;
  let m=s.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/)||s.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/)||s.match(/[?&](?:q|query|destination|ll)=(-?\d+\.\d+)(?:,|%2C)\s*(-?\d+\.\d+)/i)||s.match(/^\s*\(?(-?\d{1,2}\.\d+)\s*[, ]\s*(-?\d{1,3}\.\d+)\)?\s*$/);
  if(!m)return null;const la=+m[1],ln=+m[2];if(!isFinite(la)||!isFinite(ln)||Math.abs(la)>90||Math.abs(ln)>180)return null;return [la,ln]}
function hav(a,b){const R=6371,p=Math.PI/180;return 2*R*Math.asin(Math.sqrt(Math.sin((b[0]-a[0])*p/2)**2+Math.cos(a[0]*p)*Math.cos(b[0]*p)*Math.sin((b[1]-a[1])*p/2)**2))}
const solveCache=new Map();
// เส้นทางสั้นสุด a → ทุกจุด → b (nearest neighbour + 2-opt + or-opt, สุ่มเริ่มใหม่หลายรอบ)
function solve(pts,a,b){
  const key=JSON.stringify([a,b,pts]);if(solveCache.has(key))return solveCache.get(key);
  const nodes=[a,...pts,b],N=nodes.length,D=nodes.map(x=>nodes.map(y=>hav(x,y)));
  const mid=[...Array(N-2).keys()].map(i=>i+1);
  const cost=p=>{let c=0,prev=0;for(const x of p){c+=D[prev][x];prev=x}return c+D[prev][N-1]};
  let best=mid,bc=cost(mid);let seed=1;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  for(let t=0;t<12&&mid.length>1;t++){let cur;
    if(t===0){cur=[];const rem=new Set(mid);let c=0;while(rem.size){let n=null,bd=1e18;for(const x of rem)if(D[c][x]<bd){bd=D[c][x];n=x}cur.push(n);rem.delete(n);c=n}}
    else{cur=mid.slice();for(let i=cur.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[cur[i],cur[j]]=[cur[j],cur[i]]}}
    let cc=cost(cur),imp=true;
    while(imp){imp=false;
      for(let i=0;i<cur.length;i++)for(let j=i+1;j<cur.length;j++){const nc=cur.slice(0,i).concat(cur.slice(i,j+1).reverse(),cur.slice(j+1));const v=cost(nc);if(v<cc-1e-9){cur=nc;cc=v;imp=true}}
      for(let i=0;i<cur.length;i++)for(let j=0;j<cur.length;j++){if(i===j)continue;const t2=cur.slice();t2.splice(j,0,t2.splice(i,1)[0]);const v=cost(t2);if(v<cc-1e-9){cur=t2;cc=v;imp=true}}}
    if(cc<bc){bc=cc;best=cur}}
  const res=best.map(m=>m-1);solveCache.set(key,res);return res;
}
function hm2min(s){const [h,m]=String(s).split(':').map(Number);return h*60+(m||0)}
function min2hm(x){x=Math.round(x);x=((x%1440)+1440)%1440;return `${pad(Math.floor(x/60))}:${pad(x%60)}`}
function rPts(){const R=S.route;return {A:parseLL(R.start),B:parseLL(R.end),M:parseLL(R.market)}}
function llOf(r){const e=empOf(r);return e&&isFinite(e.lat)&&isFinite(e.lng)&&e.lat!==null?[+e.lat,+e.lng]:null}
function applyPrec(list,pickup){
  const rules=(S.route.prec||[]).filter(p=>pickup||!p[2]);let ch=true,guard=0;
  while(ch&&guard++<50){ch=false;for(const [b,a] of rules){const ids=list.map(r=>empOf(r)?.eid||r.eid);const i=ids.indexOf(b),j=ids.indexOf(a);if(i>=0&&j>=0&&i>j){list.splice(j,0,list.splice(i,1)[0]);ch=true}}}
  return list}
// คน (ไม่รวมคนที่กด "ไม่ขึ้น") ที่มีพิกัด เรียงตามลำดับในรายการ
function riders(list){const ok=[],miss=[];for(const r of list||[]){if(r.status==='no')continue;(llOf(r)?ok:miss).push(r)}return {ok,miss}}
function gmapsLinks(pts,a,b){
  const f=p=>p[0].toFixed(6)+','+p[1].toFixed(6);const all=[a,...pts,b];const out=[];let i=0;
  while(i<all.length-1){const seg=all.slice(i,i+11);out.push('https://www.google.com/maps/dir/?api=1&travelmode=driving&origin='+f(seg[0])+'&destination='+f(seg[seg.length-1])+(seg.length>2?'&waypoints='+encodeURIComponent(seg.slice(1,-1).map(f).join('|')):''));i+=seg.length-1}
  return out}
function monDoc(){return S.months.find(m=>m.id===S.month)}
function firstT(dd,s){const m=monDoc();return (m&&m.firstT&&m.firstT[dd]&&m.firstT[dd][s])||''}
function saveMonDoc(){const m=monDoc();if(!m)return;const {id,...rest}=m;rest.updatedAt=new Date().toISOString();return saveDoc(`months/${id}`,rest)}
function isMarketDay(dd){return S.route.marketOn&&dateOf(dd).getDay()===+S.route.marketDow}
function mktMin(n){return Math.max(0,2.5*n-2.5)}
// ขารับ: ใช้ลำดับในรายการ (กดจัดลำดับอัตโนมัติได้) · ตรึงเวลา "ถึงคนแรก"
function pickupLeg(dd,s){
  const R=S.route,{A,B,M}=rPts();const L=(S.days[dd]||{})[s]||[];const {ok,miss}=riders(L);
  if(!A||!B||!ok.length)return {n:0,miss:miss.length};
  const pts=ok.map(llOf),k=R.rf*60/R.speed,mkt=s==='morning'&&isMarketDay(dd)&&M;
  let km=0,t=0;const eta=[0];
  for(let i=1;i<pts.length;i++){const d=hav(pts[i-1],pts[i])*R.rf;km+=d;t+=d*60/R.speed+ +R.stop;eta.push(t)}
  const last=pts[pts.length-1];let tail=hav(last,B)*R.rf,extra=0,mm=0;
  if(mkt){mm=mktMin(ok.length);const via=(hav(last,M)+hav(M,B))*R.rf;extra=mm+(via-tail)*60/R.speed;tail=via}
  const first=hav(A,pts[0])*R.rf;km+=first+tail;
  const ov=firstT(dd,s);const T0=ov?hm2min(ov):hm2min(s==='morning'?R.arrM:R.arrN)-extra;   // ตั้งเวลาคนแรกของวันนี้เอง → ใช้ตามนั้น
  return {n:ok.length,miss:miss.length,km,dep:T0-first*60/R.speed,arrive:T0+t+ +R.stop+tail*60/R.speed+mm,
    eta:new Map(ok.map((r,i)=>[r.name,T0+eta[i]])),mkt:mkt?mm:0,links:gmapsLinks(mkt?[...pts,M]:pts,A,B)};
}
// ขาส่ง: รอบเช้า = กะดึกของเมื่อวาน, รอบดึก = กะเช้าของวันนี้ · ตรึงเวลาออกจาก TPAC · เรียงสั้นสุดให้เอง
function dropCrew(dd,s){if(s==='night')return (S.days[dd]||{}).morning||[];const p=pad(+dd-1);return S.days[p]?S.days[p].night||[]:null}
function dropLeg(dd,s){
  const R=S.route,{A,B}=rPts();const L=dropCrew(dd,s);if(L===null)return {none:true};
  const {ok,miss}=riders(L);if(!A||!B||!ok.length)return {n:0,miss:miss.length};
  const ord=applyPrec(solve(ok.map(llOf),B,A).map(i=>ok[i]),false);const pts=ord.map(llOf);
  let km=0,t=hm2min(s==='morning'?R.leaveM:R.leaveN);const eta=new Map();let prev=B;
  ord.forEach((r,i)=>{const d=hav(prev,pts[i])*R.rf;km+=d;t+=d*60/R.speed;eta.set(r.name,t);t+= +R.stop;prev=pts[i]});
  const back=hav(prev,A)*R.rf;km+=back;
  return {n:ok.length,miss:miss.length,km,order:ord,eta,home:t+back*60/R.speed,links:gmapsLinks(pts,B,A)};
}
// จัดลำดับรับอัตโนมัติ: คนที่มีพิกัดเรียงตามเส้นทางสั้นสุด, คนที่ไม่ขึ้น/ไม่มีพิกัดไปไว้ท้าย
function optimizeList(L){
  const {A,B}=rPts();if(!A||!B)return L;const {ok}=riders(L);if(ok.length<2)return [...ok,...L.filter(r=>!ok.includes(r))];
  const ord=applyPrec(solve(ok.map(llOf),A,B).map(i=>ok[i]),true);return [...ord,...L.filter(r=>!ok.includes(r))]}
function optimizeDay(dd){const d=S.days[dd];if(!d)return;for(const s of ['morning','night'])d[s]=optimizeList(d[s]||[])}
// เติมเลขประจำตัว/พิกัด/คนเดินทางเอง จากข้อมูลเดิม ให้คนที่ยังไม่มี — คืน true ถ้ามีการเปลี่ยน
function seedEmp(e){const x=SEED.find(q=>(e.eid&&q[0]===e.eid)||q[1]===e.name);if(!x)return false;let ch=false;
  if(!e.eid){e.eid=x[0];ch=true}
  if(e.lat==null||e.lng==null||e.lat===''){e.lat=x[2];e.lng=x[3];ch=true}
  if(e.noride===undefined){e.noride=SEED_NORIDE[x[0]]||'';ch=true}
  return ch}
function monthRoutes(){let km=0,trips=0;for(const k of Object.keys(S.days))for(const s of ['morning','night']){const p=pickupLeg(k,s),q=dropLeg(k,s);if(p.n){km+=p.km;trips++}if(q.n){km+=q.km;trips++}}return {km,trips}}
function orderOf(n){const e=empByName(n);return e?e.order:999}
function dayStats(d){
  const all=[...(d.morning||[]),...(d.night||[])];
  return {m:(d.morning||[]).length,n:(d.night||[]).length,ot:all.filter(r=>r.ot).length,ride:all.filter(r=>r.status==='ride').length,no:all.filter(r=>r.status==='no').length,total:all.length,back:all.filter(r=>r.back).length,backNeed:all.filter(r=>r.status!=='no').length};
}

/* ---------- render ---------- */
function render(){
  if(S.day&&S.days[S.day])S.dayWant={m:S.month,d:S.day};   // จำวันที่กำลังดู — ซิงก์แล้วไม่เด้งไปวันอื่น
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.tab===S.tab));
  const ms=$('#monthSel');
  ms.innerHTML=S.months.length?S.months.map(m=>`<option value="${m.id}" ${m.id===S.month?'selected':''}>${esc(m.label||monthLabel(m.id))}</option>`).join(''):'<option>— ยังไม่มีเดือน —</option>';
  ms.disabled=!S.months.length;
  $('#btnExport').disabled=!S.month||!Object.keys(S.days).length;
  const main=$('#main');
  let h='';
  if(!S.loaded)h+=`<div class="banner">กำลังโหลดข้อมูล…</div>`;
  else if(!db)h+=`<div class="banner warn">ยังไม่ได้เข้าสู่ระบบ</div>`;
  if(S.pending)h+=pendingHtml();
  if(S.loaded&&!S.months.length&&!S.pending){
    h+=`<div class="empty"><h2>ยังไม่มีตารางรับส่ง</h2><ol class="steps" style="text-align:left;max-width:420px;margin:12px auto"><li>กด “นำเข้าตารางกะ” แล้วเลือกไฟล์ตารางกะรายเดือน (.xlsx)</li><li>ตรวจเดือน แล้วกดบันทึก — ระบบจัดคนขึ้นรถและลำดับรับให้ทุกวัน</li><li>แท็บ “พนักงาน”: ปักหมุดบ้านคนที่ยังไม่มีพิกัด</li></ol></div>`;
  } else if(S.month){
    h+= S.tab==='day'?dayView(): S.tab==='sum'?sumView(): empView();
  }
  const os=main.querySelector('.strip'),oL=os?os.scrollLeft:null,wY=window.scrollY;
  main.innerHTML=h;
  const st=main.querySelector('.strip'),sel=st&&st.querySelector('.chip[aria-pressed="true"]');
  if(st){
    if(sel&&(!render.scrolled||oL===null)){st.scrollLeft=Math.max(0,sel.offsetLeft-st.offsetLeft-(st.clientWidth-sel.offsetWidth)/2);render.scrolled=true}
    else if(oL!==null)st.scrollLeft=oL;   // วาดใหม่จากการซิงก์ — แถบวันที่อยู่ที่เดิม ไม่เด้งกลับวันที่ 1
  }
  if(Math.abs(window.scrollY-wY)>1)window.scrollTo(0,wY);
}

function pendingHtml(){
  const p=S.pending;const exists=S.months.some(m=>m.id===p.monthId);
  const ppl=new Set();Object.values(p.days).forEach(d=>[...d.morning,...d.night].forEach(r=>ppl.add(r.name)));
  if(p.kind==='shift'){const nm=p.people.filter(q=>{const e=(q.eid&&S.emps.find(x=>x.eid===q.eid))||empByName(q.name);return !(e&&e.lat!=null)&&!SEED.some(x=>x[0]===q.eid||x[1]===q.name)}).length;
    return `<div class="banner" style="flex-direction:column;align-items:stretch"><div><b>ตารางกะ — ${p.people.length} คน</b> · เดือน <input type="month" id="p-month" value="${p.monthId}" style="min-height:40px">${p.guessed?' <span class="danger">หาเดือนในไฟล์ไม่เจอ — ตรวจเดือนให้ถูก</span>':''}</div>
    <div class="hint">ระบบจะแยกคนกะเช้า (1, 1OT, D) / กะดึก (2, 2OT) ให้ทุกวัน · ตัดคนที่ตั้งว่าเดินทางเอง · จัดลำดับรับตามเส้นทางสั้นสุดให้${nm?` · <span class="danger">${nm} คนยังไม่มีพิกัดบ้าน (ปักหมุดได้ในแท็บพนักงานหลังบันทึก)</span>`:''}${exists?' · <span class="danger">จะเขียนทับเดือนนี้ที่มีอยู่</span>':''}</div>
    <div style="display:flex;gap:8px;justify-content:flex-end"><button class="ghost" data-act="cancelImport">ยกเลิก</button><button class="primary" data-act="confirmImport" style="min-height:44px">${exists?'เขียนทับและบันทึก':'บันทึกเดือนนี้'}</button></div></div>`}
  return `<div class="banner"><div><b>พบข้อมูล ${esc(monthLabel(p.monthId))}</b> — ${Object.keys(p.days).length} วัน · ${ppl.size} คน${exists?` <span class="danger">· จะเขียนทับข้อมูลเดือนนี้ที่มีอยู่ (รวมสถานะขึ้น/ไม่ขึ้นที่บันทึกไว้)</span>`:''}</div>
  <div style="display:flex;gap:8px"><button class="ghost" data-act="cancelImport">ยกเลิก</button><button class="primary" data-act="confirmImport">${exists?'เขียนทับและบันทึก':'บันทึกเดือนนี้'}</button></div></div>`;
}

function dayView(){
  const keys=Object.keys(S.days).sort();
  if(!keys.length)return `<div class="empty">ยังไม่มีข้อมูลรายวันของเดือนนี้</div>`;
  const now=new Date();const tdKey=`${now.getFullYear()}-${pad(now.getMonth()+1)}`===S.month?pad(now.getDate()):null;
  let h='<div class="strip" role="group" aria-label="เลือกวัน">';
  for(const k of keys){const d=S.days[k];const dt=dateOf(k);const st=dayStats(d);const we=dt.getDay()===0||dt.getDay()===6;
    h+=`<button class="chip ${we?'we':''} ${k===tdKey?'today':''}" aria-pressed="${k===S.day}" data-act="day" data-day="${k}" title="${esc(TH_D[dt.getDay()])} ${+k}">
      <span class="wd">${TH_DS[dt.getDay()]}</span><span class="dn">${+k}</span><span class="cnt"><span title="กะเช้า">☀${st.m}</span><span title="กะดึก">☾${st.n}</span></span>${st.ot?'<span class="dot" title="มี OT"></span>':''}</button>`}
  h+='</div>';
  const d=S.days[S.day];if(!d)return h;
  const dt=dateOf(S.day);const st=dayStats(d);const i=keys.indexOf(S.day);

  const miss=(p.miss||0);if(miss)h+=`<div class="rl warn">⚠ ${miss} คนยังไม่มีพิกัดบ้าน — ไม่ได้อยู่ในเส้นทาง (ไปที่แท็บ “พนักงาน” แล้วกดแก้ไขเพื่อปักหมุด)</div>`;
  return h+'</div>'}

function monthSummary(){
  const per={};const days=[];
  for(const k of Object.keys(S.days).sort()){const d=S.days[k];const st=dayStats(d);days.push({k,...st});
    for(const s of ['morning','night'])for(const r of d[s]||[]){
      const p=per[r.name]||(per[r.name]={name:r.name,team:r.team,m:0,n:0,ride:0,no:0,ot:0,otDays:[]});
      p[s==='morning'?'m':'n']++; if(r.status==='ride')p.ride++; if(r.status==='no')p.no++; if(r.ot){p.ot++;p.otDays.push(+k)}
    }}
  return {per:Object.values(per).sort((a,b)=>b.ot-a.ot||orderOf(a.name)-orderOf(b.name)),days};
}

  h+=`</tbody></table></div><div class="pcards">${per.map(p=>`<div class="pcard"><div><span class="nm">${esc(p.name)}</span>${p.team?`<span class="team">${esc(p.team)}</span>`:''}</div><div class="otn">${p.ot}<small>OT</small></div>

  return h+`</tbody></table></div></div>`;

/* ---------- import / export ---------- */
// ตารางกะรายเดือน: แถวหัวมี "เลขประจำตัว"/"ชื่อ" + แถวเลขวัน 1..31 · รหัส 1/2/1OT/2OT/H/D/DOT
const EN_M=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
function findMonth(rows,fname){
  const txt=[fname||'',...rows.slice(0,6).flat().filter(v=>typeof v==='string')].join(' ');
  for(let i=0;i<12;i++){const m=txt.match(new RegExp(TH_M[i]+'\\s*(\\d{4})'));if(m){let y=+m[1];if(y>2400)y-=543;return `${y}-${pad(i+1)}`}}
  const e=txt.match(/(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*[\s\-_]*(\d{2,4})/i);
  if(e){let y=+e[2];if(y<100)y+=2000;return `${y}-${pad(EN_M.indexOf(e[1].toLowerCase())+1)}`}
  return null}
function parseShiftTable(rows,fname,forceMonth){
  const hi=rows.findIndex(r=>r&&r.some(v=>typeof v==='string'&&/เลขประจำตัว|รหัสพนักงาน/.test(v)));if(hi<0)return null;
  const H=rows[hi].map(v=>str(v));const col=re=>H.findIndex(v=>re.test(v));
  const cId=col(/เลขประจำตัว|รหัสพนักงาน/),cName=col(/ชื่อ/),cTeam=col(/ทีม|กะ/),cPhone=col(/เบอร์|โทร/),cPlace=col(/สถานที่|จุดรับ/);
  // หาแถวเลขวัน (แถวหัวเองหรือแถวถัดไป)
  let dayCols={};for(const r of [rows[hi+1]||[],rows[hi]]){const m={};r.forEach((v,c)=>{const n=typeof v==='number'?v:/^\d{1,2}$/.test(str(v))?+str(v):null;if(n>=1&&n<=31&&c!==cId)m[c]=n});if(Object.keys(m).length>=28){dayCols=m;break}}
  if(!Object.keys(dayCols).length||cName<0)return null;
  const monthId=forceMonth||findMonth(rows,fname);const days={};const people=[];
  const y=monthId?+monthId.slice(0,4):new Date().getFullYear(),mo=monthId?+monthId.slice(5):new Date().getMonth()+1;const nd=new Date(y,mo,0).getDate();
  for(let i=1;i<=nd;i++)days[pad(i)]={d:i,weekday:TH_D[new Date(y,mo-1,i).getDay()],morning:[],night:[]};
  for(const r of rows.slice(hi+1)){const id=cId>=0?str(r[cId]):'';const name=str(r[cName]);
    if(!name||(cId>=0&&!/^\d{4,}$/.test(id)))continue;
    const p={eid:id,name,team:cTeam>=0?str(r[cTeam]):'',phone:cPhone>=0?str(r[cPhone]):'',place:cPlace>=0?str(r[cPlace]):'',codes:{}};people.push(p);
    for(const [c,n] of Object.entries(dayCols)){if(n>nd)continue;const code=str(r[c]).toUpperCase().replace(/\s/g,'');if(!code)continue;p.codes[n]=code;
      const sh=MORNING_C.has(code)?'morning':NIGHT_C.has(code)?'night':null;if(!sh)continue;
      days[pad(n)][sh].push({eid:id,name,team:p.team,phone:p.phone,place:p.place,code,ot:/OT$/.test(code),status:'',note:''})}}
  if(!people.length)return null;
  return {kind:'shift',monthId:monthId||curMonthId(),guessed:!monthId,days,people,rows,fname};
}
function noRideHit(e,sh,day){if(!e||!e.noride)return false;if(e.noride!=='all'&&e.noride!==sh)return false;
  if(e.noFrom&&day<+e.noFrom)return false;if(e.noTo&&day>+e.noTo)return false;return true}
function parseWorkbook(wb,fname){
  const ws=wb.Sheets[wb.SheetNames[0]];const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:null,raw:true});
  const st=parseShiftTable(rows,fname);if(st)return st;
  const days={};let monthId=null;
  for(const off of [0,6]){let cur=null,shift=null;
    for(const r of rows){const v=r[off];
      if(typeof v==='string'){const t=v.trim();
        const m=t.match(/^(\S+)\s+(\d{1,2})\s+(\S+)\s+(\d{4})$/);
        if(m&&TH_M.includes(m[3])){let y=+m[4];if(y>2400)y-=543;monthId=`${y}-${pad(TH_M.indexOf(m[3])+1)}`;cur=pad(+m[2]);days[cur]=days[cur]||{d:+m[2],weekday:m[1],morning:[],night:[]};shift=null;continue}
        if(t.startsWith('กะเช้า')){shift='morning';continue}
        if(t.startsWith('กะดึก')){shift='night';continue}
      } else if(typeof v==='number'&&cur&&shift){
        const raw=str(r[off+1]);if(!raw)continue;
        const ot=/★\s*OT/i.test(raw);const status=/✗/.test(raw)?'no':/✓/.test(raw)?'ride':'';
        const name=raw.replace(/★\s*OT/ig,'').replace(/✓\s*ขึ้น|✗\s*ไม่ขึ้น/g,'').trim();
        days[cur][shift].push({name,team:str(r[off+2]),phone:str(r[off+3]),place:str(r[off+4]),ot,status,note:''});
      }}}
  return {monthId,days};
}
// ตารางกะ → อัปเดตรายชื่อพนักงาน (เลขประจำตัว/เบอร์/จุดรับ) + ตัดคนที่เดินทางเอง + จัดลำดับทุกวัน
function finishShiftImport(p){
  for(const q of p.people){let e=(q.eid&&S.emps.find(x=>x.eid===q.eid))||empByName(q.name);
    if(!e){e={id:empKey(q.eid||q.name),eid:q.eid,name:q.name,team:q.team,phone:q.phone,place:q.place,order:S.emps.length+1,lat:null,lng:null};seedEmp(e);S.emps.push(e)}
    else{Object.assign(e,{eid:q.eid||e.eid,name:q.name,team:q.team||e.team,phone:q.phone||e.phone,place:q.place||e.place});seedEmp(e)}
    saveEmp(e)}
  for(const [k,d] of Object.entries(p.days)){for(const s of ['morning','night'])d[s]=d[s].filter(r=>!noRideHit(empOf(r),s,+k))}
  const keep=S.month;S.month=p.monthId;for(const k of Object.keys(p.days)){const sv=S.days;S.days=p.days;optimizeDay(k);S.days=sv}S.month=keep;
}
async function writeMonth(id,days){
  // upsert employees first
  for(const d of Object.values(days))for(const s of ['morning','night'])d[s].forEach((r,i)=>{
    if(!empOf(r)){const e={id:empKey(r.name),eid:r.eid||'',name:r.name,team:r.team,phone:r.phone,place:r.place,order:S.emps.length+1,lat:null,lng:null};seedEmp(e);S.emps.push(e);saveEmp(e)}});
  if(!S.months.some(m=>m.id===id))S.months.push({id,label:monthLabel(id)});
  S.months.sort((a,b)=>b.id.localeCompare(a.id));
  {const {id:_i,...old}=S.months.find(m=>m.id===id)||{};await saveDoc(`months/${id}`,{...old,label:monthLabel(id),updatedAt:new Date().toISOString()})}
  selectMonth(id);S.days=days;pickDay();render.scrolled=false;render();
  for(const [k,d] of Object.entries(days))saveDoc(`months/${id}/days/${k}`,d);
}
async function onFile(file){
  if(!window.XLSX){toast('โหลดตัวอ่าน Excel ไม่สำเร็จ ลองรีเฟรช');return}
  try{const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});const p=parseWorkbook(wb,file.name);
    if(!p.monthId||!Object.keys(p.days).length){toast('ไม่พบตารางในไฟล์นี้ — ใช้ได้ทั้งไฟล์ตารางกะรายเดือน (มีคอลัมน์เลขประจำตัว + วันที่ 1–31) และไฟล์ตารางรับส่ง');return}
    S.pending=p;S.tab='day';render();window.scrollTo({top:0});
  }catch(e){toast('อ่านไฟล์ไม่ได้: '+e.message)}
}
function buildWorkbook(){
  const wb=XLSX.utils.book_new();const lbl=monthLabel(S.month);const keys=Object.keys(S.days).sort();
  const mark=r=>r.name+(r.ot?'   ★OT':'')+(r.status==='ride'?'  ✓ขึ้น':r.status==='no'?'  ✗ไม่ขึ้น':'');
  const block=k=>{const d=S.days[k];const dt=dateOf(k);const out=[[`${TH_D[dt.getDay()]}  ${+k} ${lbl}`,null,null,null,null]];let hdr=false;
    for(const s of ['morning','night']){const L=d[s]||[];if(!L.length)continue;out.push([`${SH[s].label}  ${SH[s].xl}   (${L.length} คน)`,null,null,null,null]);
      if(!hdr){out.push(['รับคนที่','ชื่อ-สกุล','ทีม/กะ','เบอร์โทร','จุดรับ-ส่ง']);hdr=true}
      L.forEach((r,i)=>out.push([i+1,mark(r),r.team,r.phone,r.place]))}
    return out};
  const aoa=[[`ตารางรับ-ส่งพนักงาน ${lbl}   (ลำดับรับ: ใกล้ → ไกล)`]];
  for(let i=0;i<keys.length;i+=2){const L=block(keys[i]);const R=keys[i+1]?block(keys[i+1]):[];const n=Math.max(L.length,R.length);
    for(let j=0;j<n;j++)aoa.push([...(L[j]||[null,null,null,null,null]),null,...(R[j]||[])])}
  const ws1=XLSX.utils.aoa_to_sheet(aoa);ws1['!cols']=[{wch:8},{wch:34},{wch:12},{wch:13},{wch:32},{wch:3},{wch:8},{wch:34},{wch:12},{wch:13},{wch:32}];
  XLSX.utils.book_append_sheet(wb,ws1,'รายวัน');
  const list=[['วันที่','วัน','กะ','ลำดับ','ชื่อ-สกุล','ทีม/กะ','เบอร์โทร','จุดรับ-ส่ง','OT','สถานะ','กลับ','หมายเหตุ']];
  for(const k of keys)for(const s of ['morning','night'])(S.days[k][s]||[]).forEach((r,i)=>list.push([+k,TH_D[dateOf(k).getDay()],SH[s].label,i+1,r.name,r.team,r.phone,r.place,r.ot?'OT':'',r.status==='ride'?'ขึ้น':r.status==='no'?'ไม่ขึ้น':'',r.back?'✓':'',r.note||'']));
  const ws2=XLSX.utils.aoa_to_sheet(list);ws2['!cols']=[{wch:6},{wch:10},{wch:8},{wch:6},{wch:30},{wch:12},{wch:13},{wch:30},{wch:5},{wch:8},{wch:6},{wch:20}];
  XLSX.utils.book_append_sheet(wb,ws2,'รายการ');
  const {per}=monthSummary();const sm=[['ชื่อ-สกุล','ทีม/กะ','กะเช้า','กะดึก','ขึ้น','ไม่ขึ้น','OT (ครั้ง)','วันที่ทำ OT']];
  per.forEach(p=>sm.push([p.name,p.team,p.m,p.n,p.ride,p.no,p.ot,p.otDays.join(', ')]));
  const ws3=XLSX.utils.aoa_to_sheet(sm);ws3['!cols']=[{wch:30},{wch:12},{wch:8},{wch:8},{wch:6},{wch:8},{wch:10},{wch:40}];
  XLSX.utils.book_append_sheet(wb,ws3,'สรุป OT');
  return wb;
}
async function doExport(){

function vanChip(){
  const b=$('#btnSync');if(!b)return;b.classList.remove('ok','busy','err');
  const last=VAN.devices.map(d=>d.last_seen&&new Date(d.last_seen)).filter(Boolean).sort((a,b)=>b-a)[0];
  let t='เชื่อมจอรถ';
  if(VAN.busy){b.classList.add('busy');t='กำลังซิงก์…'}
  else if(VAN.state==='off'||NET.offline){t='ออฟไลน์'}
  else if(VAN.state==='err'){b.classList.add('err');t='ซิงก์ไม่ได้'}
  else if(VAN.devices.length){const fresh=last&&Date.now()-last<10*60e3;if(fresh)b.classList.add('ok');
    $('#syncTxt').innerHTML='<span class="tl">จอ </span>'+(last?hhmm(last):'ยังไม่ต่อ');return}
  $('#syncTxt').textContent=t;
}
async function vanLoadDevices(){const {data,error}=await sb.from('devices').select('id,label,last_seen,fw_version,created_at').eq('van_id',CTX.vanId).order('created_at');if(error)throw error;VAN.devices=data||[]}
async function vanLoadMeta(month){
  if(VAN.syncMonth===month)return;VAN.syncMonth=month;VAN.applied={};VAN.rev=0;
  try{const d=await db.doc(`vansync/${month}`).get();if(d.exists){const x=d.data();VAN.applied=clone(x.applied)||{};VAN.rev=+x.rev||0}}catch{}
}
async function vanPull(month){
  await vanLoadMeta(month);
  const {data,error}=await sb.from('van_status').select('rev,status,at').eq('van_id',CTX.vanId).eq('month',month).maybeSingle();
  if(error)throw error;VAN.lastPull=new Date();if(!data)return 0;
  const st={month,rev:data.rev,status:data.status||{},at:data.at};VAN.devAt=st.at?new Date(st.at):null;
  if((+st.rev||0)===VAN.rev&&JSON.stringify(st.status)===JSON.stringify(VAN.applied))return 0;
  if(month!==S.month)return 0;
  const changed=new Set();let n=0;
  // ล่าสุดชนะ: ใช้ค่าจากจอเมื่อ (ก) ค่าบนจอเปลี่ยนจากที่เคยรับ หรือ (ข) จอส่งรอบใหม่หลังจากที่แอปแก้ช่องนี้ครั้งล่าสุด
  // (ข) แก้เคส: แอปกด "ไม่ขึ้น" แล้วจอกด "ขึ้น" ซ้ำค่าเดิมที่เคยส่ง → เดิมแอปไม่รับ
  const newer=(+st.rev||0)>VAN.rev,pushedAt=st.at?Date.parse(st.at):0;
  for(const [key,val] of Object.entries(st.status)){
    const parts=key.split('|');const isBack=parts.length>=4&&parts[parts.length-1]==='b';
    const dd=parts[0],sh=parts[1]==='n'?'night':'morning',name=parts.slice(2,isBack?-1:undefined).join('|');
    const day=S.days[dd];const rr=day&&(day[sh]||[]).find(x=>x.name===name);if(!rr)continue;
    const boardV=isBack?!!val:(val==='r'?'ride':val==='n'?'no':''),cur=isBack?!!rr.back:(rr.status||'');
    if(boardV===cur)continue;
    const boardChanged=JSON.stringify(VAN.applied[key])!==JSON.stringify(val);
    const appAt=Date.parse((isBack?rr.backAt:rr.stAt)||0)||0;
    if(!boardChanged&&!(newer&&pushedAt>appAt))continue;
    if(isBack)rr.back=boardV;else rr.status=boardV;
    changed.add(dd);n++;
  }
  VAN.applied=clone(st.status);VAN.rev=+st.rev||0;
  saveDoc(`vansync/${month}`,{applied:VAN.applied,rev:VAN.rev,at:new Date().toISOString()});
  changed.forEach(dd=>saveDoc(`months/${month}/days/${dd}`,S.days[dd]));
  if(changed.size)render();
  return n;
}
function vanErr(e){return 'ซิงก์ไม่สำเร็จ: '+(e?.message||e)}
async function vanSync(opts={}){
  if(VAN.busy)return;VAN.busy=true;vanChip();
  try{await vanLoadDevices();const m=vanMonth();const n=m?await vanPull(m):0;
    VAN.state='ok';VAN.msg=n?`รับผลจากจอรถ ${n} รายการ`:'';if(opts.toast)toast(n?VAN.msg:'ซิงก์แล้ว')}
  catch(e){if(isNetErr(e)){VAN.state='off';VAN.msg='ไม่มีเน็ต — จะดึงผลจากจอเมื่อมีเน็ต'}else{VAN.state='err';VAN.msg=vanErr(e)}if(opts.toast)toast(VAN.msg)}
  finally{VAN.busy=false;vanChip();if($('#syncSheet'))vanSheetBody()}
}
function vanStartAuto(){if(VAN.pullI)return;VAN.pullI=setInterval(()=>{if(document.visibilityState==='visible')vanSync()},60000);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')vanSync()})}

        const blob=await new Promise(r=>cv.toBlob(r,'image/png'));await dl.save({filename:formFileBase(f)+'.png',data:blob});toast('บันทึกรูปแล้ว')}
      catch(err){if(err?.code!=='declined')toast('บันทึกรูปไม่สำเร็จ: '+(err?.message||err?.code))}finally{b.disabled=false}}
    if(a==='xlsx'){const F=S.form;const sh=SH[f.shift];const hdr=['ลำดับ','ชื่อ','กะ','ที่อยู่','เบอร์โทร'];const rows=(L,n=6)=>Array.from({length:Math.max(n,L.length)},(_,i)=>L[i]?[i+1,L[i].name,L[i].team,L[i].place,L[i].phone]:[i+1,'','','','']);
      const be=beParts(f);
      const aoa=[[F.company],[F.addr1],[F.addr2],['E-Mail : '+F.email],[],[F.title],[`วันที่ ${be.d} เดือน ${be.m} พ.ศ. ${be.y}`],[],
        [`( รถหลัก ) เบอร์ ${F.mainNo}  ทะเบียนรถ ${F.mainPlate}  ขอใช้รถเสริมในช่วง ${f.shift==='morning'?'☑ เช้า  ☐ เย็น':'☐ เช้า  ☑ เย็น'}`],[`พขร. ${F.driver}   เบอร์โทร ${F.driverPhone}`],hdr,...rows(f.main),[],
        [`( รถเสริม ) ทะเบียน ${(F.extraNo?F.extraNo+' ':'')+F.extraPlate}`],[`พขร. ${F.extraDriver}   เบอร์โทร ${F.extraPhone}`],hdr,...rows(f.extra),[],
        [`OT.จำนวน ${f.ot.length} ท่าน`],hdr,...rows(f.ot,3)];
      const ws=XLSX.utils.aoa_to_sheet(aoa);ws['!cols']=[{wch:7},{wch:32},{wch:12},{wch:36},{wch:14}];ws['!merges']=[0,1,2,3,5,6].map(r=>({s:{r,c:0},e:{r,c:4}}));
      const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'ใบขอรถ');
      try{await dl.save({filename:formFileBase(f)+'.xlsx',data:new Uint8Array(XLSX.write(wb,{bookType:'xlsx',type:'array'}))});toast('ส่งออกแล้ว')}catch(err){if(err?.code!=='declined')toast('ส่งออกไม่สำเร็จ: '+(err?.message||err?.code))}}
  });
}

  openSheet(`<h3>⚙ ตั้งค่าเส้นทาง</h3>
   <div class="row2">${f('startName','ชื่อจุดเริ่มต้น',R.startName)}${f('start','พิกัดจุดจอดรถ (เริ่มต้น/จบ)',R.start,'12.67, 101.27')}</div>
   <div class="row2">${f('endName','ชื่อปลายทาง',R.endName)}${f('end','พิกัดโรงงาน',R.end)}</div>
   <div class="row2"><div class="field"><label for="r-arrM">รอบเช้า: ถึงคนแรก</label><input id="r-arrM" type="time" value="${R.arrM}"></div><div class="field"><label for="r-leaveM">รอบเช้า: ออกจากโรงงาน (ขาส่ง)</label><input id="r-leaveM" type="time" value="${R.leaveM}"></div></div>

   <div class="row2">${f('market','พิกัดตลาด',R.market)}<div class="field"><label for="r-marketDow">วัน</label><select id="r-marketDow">${TH_D.map((t,i)=>`<option value="${i}" ${+R.marketDow===i?'selected':''}>${t}</option>`).join('')}</select></div></div>
   <div class="field"><label for="r-stop">เวลาพนักงานขึ้นรถ (นาที/คน)</label><input id="r-stop" type="number" step="0.5" min="0" value="${R.stop}"><span class="hint">บวกเพิ่มทุกคนหลังรับคนแรก เช่น 1–2 นาที</span></div>

   </details>
   <div class="foot"><button class="ghost" id="r-reset">คืนค่าเริ่มต้น</button><div><button class="ghost" data-act="close">ยกเลิก</button><button class="primary" id="r-save">บันทึก</button></div></div>`,sh=>{
    sh.querySelector('#r-reset').onclick=()=>{S.route={...ROUTE_DEF};solveCache.clear();saveDoc('settings/route',S.route);closeSheet();render();toast('คืนค่าเริ่มต้นแล้ว')};
    sh.querySelector('#r-save').onclick=()=>{const v=id=>sh.querySelector('#r-'+id).value.trim();

      const nr={...R,startName:v('startName'),start:v('start'),endName:v('endName'),end:v('end'),market:v('market'),marketDow:+v('marketDow'),marketOn:sh.querySelector('#r-marketOn').checked,

}

/* ---------- ส่งออกข้อมูลทั้งหมด (ย้ายไประบบใหม่) ---------- */
async function exportAll(){
  if(!db||!dl){toast('ส่งออกไม่ได้ในมุมมองนี้');return}
  toast('กำลังรวบรวมข้อมูล…');
  const months=[];
  for(const m of S.months){const days=await new Promise(res=>{let un=null,done=false;
      un=db.collection(`months/${m.id}/days`).onSnapshot(snap=>{if(done)return;done=true;const o={};snap.docs.forEach(d=>o[d.id]=clone(d.data()));res(o);setTimeout(()=>un&&un(),0)},()=>{done=true;res({})})});
    months.push({id:m.id,label:m.label||monthLabel(m.id),days})}
  const vansync={};for(const m of S.months){try{const d=await db.doc(`vansync/${m.id}`).get();if(d.exists)vansync[m.id]=clone(d.data())}catch{}}
  const b={kind:'tpac-backup',v:1,at:new Date().toISOString(),employees:S.emps.map(e=>clone(e)),
    settings:{form:{...S.form,logo1:S.form.logo1||LOGO_TS,logo2:S.form.logo2||LOGO_ACS},route:clone(S.route)},months,vansync};
  const n=new Date();
  try{await dl.save({filename:`tpac_backup_${n.getFullYear()}${pad(n.getMonth()+1)}${pad(n.getDate())}.json`,data:new Blob([JSON.stringify(b)],{type:'application/json'})});
    toast(`ส่งออกแล้ว — พนักงาน ${b.employees.length} คน · ${months.length} เดือน`)}catch(e){if(e?.code!=='declined')toast('ส่งออกไม่สำเร็จ: '+(e?.message||e?.code))}
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act;
  if(a==='scrim'&&e.target!==t)return;
  const s=t.dataset.shift,i=+t.dataset.i;const d=S.days[S.day];
  switch(a){
    case 'day': if(t.dataset.day){S.day=t.dataset.day;S.dayWant={m:S.month,d:S.day};render.scrolled=true;render()} break;
    case 'mshift': S.mShift=s;render();break;
    case 'form': openFormSetup();break;
    case 'goto': S.day=t.dataset.day;S.dayWant={m:S.month,d:S.day};S.tab='day';render.scrolled=false;render();window.scrollTo({top:0});break;
    case 'st': if(d[s][i].status!==t.dataset.v){d[s][i].status=t.dataset.v;d[s][i].stAt=new Date().toISOString();saveDay(S.day)} break;
    case 'stClear': d[s][i].status='';d[s][i].stAt=new Date().toISOString();saveDay(S.day);break;
    case 'back': d[s][i].back=!d[s][i].back;d[s][i].backAt=new Date().toISOString();saveDay(S.day);break;
    case 'ot': d[s][i].ot=!d[s][i].ot;saveDay(S.day);break;
    case 'mv':{const j=i+(+t.dataset.d);const L=d[s];[L[i],L[j]]=[L[j],L[i]];saveDay(S.day);break}
    case 'edit': editRider(s,i);break;
    case 'firstT': if(!document.body.classList.contains('ro'))editFirstT(s);break;
    case 'add': addRider(s);break;
    case 'empAdd': editEmp(null);break;
    case 'empEdit': editEmp(t.dataset.id);break;
    case 'empMv':{const k=S.emps.findIndex(x=>x.id===t.dataset.id);const j=k+(+t.dataset.d);[S.emps[k],S.emps[j]]=[S.emps[j],S.emps[k]];
      S.emps.forEach((x,n)=>{if(x.order!==n+1){x.order=n+1;saveEmp(x)}});render();break}
    case 'close': case 'scrim': closeSheet();break;
    case 'cancelImport': S.pending=null;render();break;
    case 'confirmImport':{let p=S.pending;
      if(p.kind==='shift'){const v=$('#p-month')?.value;if(v&&v!==p.monthId)p=parseShiftTable(p.rows,p.fname,v);finishShiftImport(p)}
      S.pending=null;writeMonth(p.monthId,p.days).then(()=>toast('บันทึก '+monthLabel(p.monthId)+' แล้ว'));break}
    case 'opt': d[s]=optimizeList(d[s]);saveDay(S.day);toast('จัดลำดับตามเส้นทางสั้นสุดแล้ว');break;
    case 'settings': openRouteSettings();break;
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{S.tab=t.dataset.tab;render.scrolled=false;render()});
$('#monthSel').onchange=e=>{render.scrolled=false;selectMonth(e.target.value)};

// • ทุกรายการที่โหลดได้ เก็บสำเนาไว้ในเครื่อง (localStorage) → เปิดแอปตอนไม่มีเน็ตก็เห็นข้อมูลล่าสุด
// • แก้ไขตอนไม่มีเน็ต → เข้า "กล่องรอส่ง" (outbox) แล้วส่งเองเมื่อมีเน็ต
// • ตอนส่ง ถ้าในเซิร์ฟเวอร์มีคนแก้วันเดียวกันไปแล้ว จะรวมทีละคน (เฉพาะช่องที่เราแก้) ไม่ทับของคนอื่นทั้งวัน
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch{return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch{return false}},del(k){try{localStorage.removeItem(k)}catch{}}};
const NET={offline:!navigator.onLine,pending:0,lastOk:null};
function isNetErr(e){const m=String(e?.message||e||'');return !navigator.onLine||/fetch|network|load failed|timed? ?out|ERR_|abort/i.test(m)}
function isAuthErr(e){const m=String(e?.message||'');return e?.code==='PGRST301'||e?.code==='PGRST303'||/jwt|expired|401/i.test(m)}
function netBadge(){
  let el=$('#netBar');
  if(!NET.offline&&!NET.pending){if(el)el.remove();return}
  if(!el){el=document.createElement('div');el.id='netBar';el.className='netbar';document.body.appendChild(el)}
  el.className='netbar'+(NET.offline?' off':'');
  el.textContent=NET.offline?`ไม่มีเน็ต — ใช้งานต่อได้${NET.pending?` · รอส่ง ${NET.pending} รายการ`:''} · จะส่งเองเมื่อมีเน็ต`:`กำลังส่งที่แก้ไว้ ${NET.pending} รายการ…`;
}
function setOnline(ok){const was=NET.offline;NET.offline=!ok;if(ok)NET.lastOk=new Date();netBadge();if(was&&ok&&typeof db?.flush==='function')db.flush()}
window.addEventListener('online',()=>setOnline(true));
window.addEventListener('offline',()=>setOnline(false));

// รวมรายชื่อวันเดียวกัน 3 ทาง: base = ที่เห็นก่อนแก้, mine = ที่เราแก้, theirs = ในเซิร์ฟเวอร์ตอนนี้
function mergeList(base,mine,theirs){
  base=base||[];mine=mine||[];theirs=theirs||[];
  const key=r=>r.name, B=new Map(base.map(r=>[key(r),r])), M=new Map(mine.map(r=>[key(r),r])), T=new Map(theirs.map(r=>[key(r),r]));
  const out=[];
  const sameOrder=JSON.stringify(base.map(key))===JSON.stringify(theirs.map(key));
  const order=sameOrder?mine.map(key):[...theirs.map(key),...mine.map(key).filter(k=>!T.has(k))];
  for(const k of order){
    const b=B.get(k),m=M.get(k),t=T.get(k);
    if(!m&&b)continue;                                   // เราลบออก
    if(!t){if(m&&!b)out.push(m);continue}                // เราเพิ่มใหม่ / เขาลบไปแล้ว
    if(!m){out.push(t);continue}
    const r={...t};
    for(const f of new Set([...Object.keys(m),...Object.keys(b||{})]))if(JSON.stringify(m[f])!==JSON.stringify(b?.[f]))r[f]=m[f];
    out.push(r);
  }
  return out;
}

// ตัวแปลง API เดิม (db.doc / db.collection) → ตาราง van_docs + day_lists ของรถคันนี้ (+ สำเนาในเครื่อง + กล่องรอส่ง)
function makeDb(vanId,coId){
  const DAY=/^months\/(\d{4}-\d{2})\/days\/(\d{2})$/, DAYS=/^months\/(\d{4}-\d{2})\/days$/;
  const CK=p=>`tk:${vanId}:c:${p}`, OK_=`tk:${vanId}:outbox`;
  const subs=new Set();
  let outbox=LS.get(OK_,[]);NET.pending=outbox.length;
  const parentOf=p=>p.slice(0,p.lastIndexOf('/')),idOf=p=>p.slice(p.lastIndexOf('/')+1);
  const dayDoc=r=>{const dd=r.day.slice(8,10);return {id:dd,data:{d:+dd,weekday:TH_D[new Date(r.day+'T00:00:00').getDay()],morning:r.morning||[],night:r.night||[]}}};
  // ใส่ของที่ยังรอส่งทับลงไป ให้หน้าจอไม่เด้งกลับเป็นค่าเก่า
  function overlay(path,docs){const map=new Map(docs.map(d=>[d.id,d]));
    for(const o of outbox)if(parentOf(o.path)===path){if(o.op==='del')map.delete(idOf(o.path));else map.set(idOf(o.path),{id:idOf(o.path),data:o.data})}
    return [...map.values()]}
  function cacheDoc(path,data){const pp=parentOf(path),c=LS.get(CK(pp),null);if(!c)return;const i=c.findIndex(d=>d.id===idOf(path));
    if(data===null){if(i>=0)c.splice(i,1)}else if(i>=0)c[i].data=data;else c.push({id:idOf(path),data});LS.set(CK(pp),c)}
  async function fetchPath(path){
    const m=path.match(DAYS);
    if(m){const [y,mo]=m[1].split('-').map(Number);const last=new Date(y,mo,0).getDate();
      const {data,error}=await sb.from('day_lists').select('day,morning,night').eq('van_id',vanId).gte('day',`${m[1]}-01`).lte('day',`${m[1]}-${pad(last)}`);
      if(error)throw error;return (data||[]).map(dayDoc)}
    const {data,error}=await sb.from('van_docs').select('path,data').eq('van_id',vanId).like('path',path+'/%');
    if(error)throw error;
    return (data||[]).filter(r=>!r.path.slice(path.length+1).includes('/')).map(r=>({id:r.path.slice(path.length+1),data:r.data}));
  }
  async function load(path){
    try{const docs=await fetchPath(path);LS.set(CK(path),docs);setOnline(true);return overlay(path,docs)}
    catch(e){if(!isNetErr(e)&&!isAuthErr(e))throw e;setOnline(false);
      if(isAuthErr(e))sb.auth.refreshSession().catch(()=>{});
      const c=LS.get(CK(path),null);if(c)return overlay(path,c);throw e}
  }
  async function refresh(s){try{const docs=await load(s.path);const sig=JSON.stringify(docs);if(sig===s.sig)return;s.sig=sig;
      s.cb({docs:docs.map(x=>({id:x.id,data:()=>clone(x.data)}))})}catch(e){s.err&&s.err(e)}}
  async function remoteGet(path){const m=path.match(DAY);
    if(m){const {data,error}=await sb.from('day_lists').select('day,morning,night').eq('van_id',vanId).eq('day',`${m[1]}-${m[2]}`).maybeSingle();if(error)throw error;return data?dayDoc(data).data:null}
    const {data,error}=await sb.from('van_docs').select('data').eq('van_id',vanId).eq('path',path).maybeSingle();if(error)throw error;return data?data.data:null}
  async function remoteSet(path,data){const m=path.match(DAY);let r;
    if(m)r=await sb.from('day_lists').upsert({van_id:vanId,company_id:coId,day:`${m[1]}-${m[2]}`,morning:data.morning||[],night:data.night||[],updated_at:new Date().toISOString()});
    else r=await sb.from('van_docs').upsert({van_id:vanId,company_id:coId,path,data,updated_at:new Date().toISOString()});
    if(r.error)throw r.error}
  async function remoteDel(path){const m=path.match(DAY);const r=m?await sb.from('day_lists').delete().eq('van_id',vanId).eq('day',`${m[1]}-${m[2]}`):await sb.from('van_docs').delete().eq('van_id',vanId).eq('path',path);if(r.error)throw r.error}
  function saveOutbox(){LS.set(OK_,outbox);NET.pending=outbox.length;netBadge()}
  function enqueue(op,path,data){
    const prev=outbox.find(o=>o.path===path);
    if(prev){prev.op=op;prev.data=data;prev.at=new Date().toISOString()}
    else{const cached=(LS.get(CK(parentOf(path)),[])||[]).find(d=>d.id===idOf(path));
      outbox.push({op,path,data,base:cached?cached.data:null,at:new Date().toISOString()})}
    saveOutbox();
  }
  // ข้อมูลพนักงาน: ผู้ที่ไม่ใช่ผู้อนุมัติ → รวมเป็นคำขอเดียว (รอ 1.5 วิ ให้การแก้หลายคนพร้อมกันอยู่ในคำขอเดียว)
  const empQ=new Map();let empT=null;
  function queueEmp(path,data){const id=idOf(path);
    const cached=(LS.get(CK('employees'),[])||[]).find(d=>d.id===id);
    if(data&&cached&&JSON.stringify(cached.data)===JSON.stringify(data)){empQ.delete(id);return}
    if(!data&&!cached){empQ.delete(id);return}
    empQ.set(id,data);clearTimeout(empT);empT=setTimeout(sendEmp,1500)}
  async function sendEmp(){
    const all=[...empQ].map(([id,data])=>({id,data}));empQ.clear();if(!all.length)return;
    for(const items of [all.filter(i=>i.data),all.filter(i=>!i.data)])if(items.length)await sendEmpBatch(items)}   // แก้ กับ ลบ แยกคำขอกัน
  async function sendEmpBatch(items){
    items=items.map(i=>i.data?i:{...i,name:(LS.get(CK('employees'),[])||[]).find(d=>d.id===i.id)?.data?.name||''});   // ชื่อคนที่ขอลบ ให้ผู้อนุมัติอ่านออก
    const names=items.map(i=>(i.data?'':'ลบ ')+(i.data?.name||(LS.get(CK('employees'),[])||[]).find(d=>d.id===i.id)?.data?.name||i.id));
    try{const r=await rpc('request_change',{p_van:vanId,p_kind:'employee',p_payload:items.length===1?items[0]:{items},
        p_summary:`ข้อมูลพนักงาน ${items.length} คน: ${names.slice(0,5).join(', ')}${names.length>5?' …':''}`});
      toast(r.status==='approved'?'บันทึกแล้ว':r.delete?'ส่งคำขอลบแล้ว — รอผู้ดูแลระบบ TanKa อนุมัติ':`ส่งขออนุมัติแล้ว (${items.length} คน) — จะเปลี่ยนเมื่อแอดมินอนุมัติ`);if(typeof loadLineReqs==='function')loadLineReqs()}
    catch(e){if(isNetErr(e)||isAuthErr(e)){items.forEach(i=>empQ.has(i.id)||empQ.set(i.id,i.data));empT=setTimeout(sendEmp,20000);toast('ไม่มีเน็ต — จะส่งคำขอเมื่อมีเน็ต')}
      else toast('ส่งคำขอไม่สำเร็จ: '+e.message)}}
  let flushing=false;
  async function flush(){
    if(flushing||!outbox.length)return;flushing=true;
    try{
      while(outbox.length){const o=outbox[0];
        try{
          if(o.op==='del')await remoteDel(o.path);
          else if(DAY.test(o.path)&&o.base){              // รวมกับที่เปลี่ยนในเซิร์ฟเวอร์ระหว่างเราออฟไลน์
            const cur=await remoteGet(o.path);let out=o.data;
            if(cur&&JSON.stringify(cur)!==JSON.stringify(o.base))out={...o.data,morning:mergeList(o.base.morning,o.data.morning,cur.morning),night:mergeList(o.base.night,o.data.night,cur.night)};
            await remoteSet(o.path,out);cacheDoc(o.path,out);
          } else {await remoteSet(o.path,o.data);cacheDoc(o.path,o.data)}
          outbox.shift();saveOutbox();setOnline(true);
        }catch(e){if(isNetErr(e)||isAuthErr(e)){setOnline(false);if(isAuthErr(e))sb.auth.refreshSession().catch(()=>{});break}
          toast('ส่งไม่สำเร็จ ข้ามรายการนี้: '+(e.message||e));outbox.shift();saveOutbox()}
      }
    }finally{flushing=false}
    if(!outbox.length)subs.forEach(s=>{s.sig=null;refresh(s)});
  }
  setInterval(()=>{if(document.visibilityState==='visible'){flush();subs.forEach(refresh)}},20000);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){flush();subs.forEach(refresh)}});
  netBadge();setTimeout(flush,500);
  return {
    flush,
    collection(path){return {onSnapshot(cb,err){const s={path,cb,err,sig:null};subs.add(s);refresh(s);return ()=>subs.delete(s)}}},
    doc(path){return {
      async set(data){data=clone(data);
        if(path.startsWith('employees/')&&!CTX.approver){queueEmp(path,data);return}
        if(CTX.access!=='edit')return;                                   // ดูอย่างเดียว
        if(outbox.length){enqueue('set',path,data);cacheDoc(path,data);flush();return}   // รักษาลำดับ: มีของค้าง → ต่อคิว
        const base=(LS.get(CK(parentOf(path)),[])||[]).find(d=>d.id===idOf(path));
        try{await remoteSet(path,data);cacheDoc(path,data);setOnline(true)}
        catch(e){if(!isNetErr(e)&&!isAuthErr(e))throw e;setOnline(false);
          outbox.push({op:'set',path,data,base:base?base.data:null,at:new Date().toISOString()});saveOutbox();cacheDoc(path,data)}},
      async delete(){
        if(path.startsWith('employees/')){queueEmp(path,null);return}   // ลบพนักงาน = คำขอเสมอ (ผู้ดูแลระบบ TanKa อนุมัติ)
        if(CTX.access!=='edit')return;
        if(outbox.length){enqueue('del',path,null);cacheDoc(path,null);flush();return}
        try{await remoteDel(path);cacheDoc(path,null);setOnline(true)}
        catch(e){if(!isNetErr(e)&&!isAuthErr(e))throw e;setOnline(false);enqueue('del',path,null);cacheDoc(path,null)}},
      async get(){
        const q=outbox.find(o=>o.path===path);if(q)return {exists:q.op!=='del',data:()=>clone(q.data)};
        try{const d=await remoteGet(path);return {exists:!!d,data:()=>d?clone(d):null}}
        catch(e){if(!isNetErr(e)&&!isAuthErr(e))throw e;const c=(LS.get(CK(parentOf(path)),[])||[]).find(x=>x.id===idOf(path));return {exists:!!c,data:()=>c?clone(c.data):null}}}
    }}
  };
}

// ไฟล์จากปุ่ม "ส่งออกข้อมูลทั้งหมด" ในแอปเดิม: {kind:'tpac-backup',employees,settings,months:[{id,label,days}],vansync}
async function importBackup(b){
  if(b?.kind!=='tpac-backup'){toast('ไม่ใช่ไฟล์สำรองจากแอปเดิม');return}
  closeSheet();toast('กำลังนำเข้า…');let n=0;
  const put=async(p,d)=>{await db.doc(p).set(d);n++};
  for(const e of b.employees||[]){const {id,...rest}=e;await put(`employees/${id}`,rest)}
  for(const [k,v] of Object.entries(b.settings||{}))await put(`settings/${k}`,v);
  for(const m of b.months||[]){await put(`months/${m.id}`,{label:m.label||monthLabel(m.id),updatedAt:new Date().toISOString()});
    for(const [dd,d] of Object.entries(m.days||{}))await put(`months/${m.id}/days/${dd}`,d)}
  for(const [k,v] of Object.entries(b.vansync||{}))await put(`vansync/${k}`,v);
  toast(`นำเข้าแล้ว ${n} รายการ`);setTimeout(()=>location.reload(),1200);
}

async function boot(){
  if(!sb){gate('<p class="danger">โหลดระบบไม่สำเร็จ — ตรวจอินเทอร์เน็ตแล้วรีเฟรช</p>');return}
  const last=LS.get('tk:lastVan',null);
  let session=null,authErr=null;
  try{const r=await sb.auth.getSession();session=r.data.session;authErr=r.error}catch(e){authErr=e}
  // ไม่มีเน็ต แต่เคยเปิดรถคันนี้ไว้ → เปิดจากสำเนาในเครื่องเลย (จะส่ง/โหลดใหม่เองเมื่อมีเน็ต)
  if(!navigator.onLine&&last){setOnline(false);openVan(last);return}
  if(!session){if(authErr&&isNetErr(authErr)&&last){setOnline(false);openVan(last);return}showStart();return}
  if(session.user.is_anonymous){
    const {data,error}=await sb.rpc('my_driver');
    if(error&&(isNetErr(error)||isAuthErr(error))&&last&&last.role==='driver'){setOnline(false);openVan(last);return}
    if(data&&data.van_id){openVan({vanId:data.van_id,companyId:data.company_id,vanName:data.van_name,vanCode:data.van_code,who:data.driver_name,role:'driver',approver:false,access:'edit'});return}
    LS.del('tk:lastVan');await sb.auth.signOut();showDriverLogin();gErr('หมดเวลาการใช้งาน หรือถูกปิดสิทธิ์ — เข้าใหม่อีกครั้ง');return}
  let ov=null;try{ov=JSON.parse(sessionStorage.getItem('openVan')||'null')}catch{}
  if(ov&&ov.role&&ov.role!=='driver'){openVan(ov);return}
  showConsole();
}

/* ---------- หน้าบริษัท: สาย · คำขอ · รถ/เจ้าของ · ผู้เช่า · ทีมงาน · ประวัติ ---------- */
const ROLE_TH={owner:'เจ้าของบัญชี (อนุมัติได้)',admin:'แอดมิน (อนุมัติได้)',staff:'พนักงาน (ต้องขออนุมัติ)',super:'ผู้ดูแลระบบ TanKa'};
const KIND_TH={employee:'ข้อมูลพนักงาน',line_assign:'เปลี่ยนรถ/คนขับ/ผู้เช่าของสาย',car_request:'ขอรถเสริม',delete:'ขอลบข้อมูล'};
const DEL_TH={line:'สาย',driver:'คนขับ',vehicle:'รถ',owner:'เจ้าของรถ',tenant:'ผู้เช่า'};
// คำขอที่มีการลบ → ต้องให้ผู้ดูแลระบบ TanKa อนุมัติ
const needsSuper=r=>r.kind==='delete'||(r.kind==='employee'&&((r.payload||{}).items||[r.payload||{}]).some(it=>!it.data||typeof it.data!=='object'));
const ST_TH={pending:'รออนุมัติ',approved:'อนุมัติแล้ว',rejected:'ไม่อนุมัติ',cancelled:'ยกเลิก'};
const fmtT=t=>t?new Date(t).toLocaleString('th-TH',{dateStyle:'short',timeStyle:'short'}):'';

async function rpc(fn,args){const {data,error}=await sb.rpc(fn,args||{});if(error)throw error;if(data&&data.ok===false)throw new Error(data.error);return data}

function reqDetail(r,ctx){
  const p=r.payload||{};
  if(r.kind==='employee'){const items=p.items||[p];
    return `<ul class="g-list">${items.slice(0,12).map(it=>it.data?`<li>${esc(it.data.name||it.id)}${it.data.phone?` · ${esc(it.data.phone)}`:''}${it.data.place?` · ${esc(it.data.place)}`:''}${it.data.lat!=null&&it.data.lat!==''?' · 📍':''}</li>`:`<li class="danger">ลบพนักงาน: ${esc(it.name||(ctx.empNames||{})[it.id]||it.id)}</li>`).join('')}${items.length>12?`<li>…อีก ${items.length-12} คน</li>`:''}</ul>`}
  if(r.kind==='line_assign'){const a=[];
    if('vehicle_id' in p)a.push('รถ → '+esc((ctx.vehicles||[]).find(v=>v.id===p.vehicle_id)?.plate||'(ไม่ระบุ)'));
    if('tenant_id' in p)a.push('ผู้เช่า → '+esc((ctx.tenants||[]).find(t=>t.id===p.tenant_id)?.name||'(ไม่ระบุ)'));
    if(p.deactivate_driver)a.push('ปิดคนขับ: '+esc((ctx.drivers||[]).find(d=>d.id===p.deactivate_driver)?.display_name||''));
    if(p.new_driver)a.push('คนขับใหม่: '+esc(p.new_driver.name)+(p.new_driver.phone?' · '+esc(p.new_driver.phone):''));
    return `<ul class="g-list">${a.map(x=>`<li>${x}</li>`).join('')}</ul>`}
  if(r.kind==='delete')return `<p class="danger">🗑 ลบ${DEL_TH[p.target]||''} “${esc(p.name||'')}”${p.van?` (สาย ${esc(p.van)})`:''}${p.target==='line'?' — ตาราง พนักงาน คนขับ และจอของสายนี้จะหายทั้งหมด':''}</p>`;
  if(r.kind==='car_request')return `<p class="hint">วันที่ ${esc(p.day)} · ${p.shift==='night'?'รอบดึก':'รอบเช้า'} · รถหลัก ${(p.main||[]).length} คน · รถเสริม ${(p.extra||[]).length} คน · OT ${(p.ot||[]).length} คน</p>`;
  return '';
}
function reqCard(r,ctx,canDecide){
  const line=(ctx.vans||[]).find(v=>v.id===r.van_id);
  const sup=needsSuper(r);if(sup&&!ctx.super)canDecide=false;

function wireReq(root,after){

function auditWhat(a){
  if(a.what.startsWith('day/')){const b=a.before||{},n=a.after||{};const ch=[];
    for(const s of ['morning','night']){const B=new Map((b[s]||[]).map(r=>[r.name,r])),N=new Map((n[s]||[]).map(r=>[r.name,r]));
      for(const [k,r] of N){const o=B.get(k);if(!o)ch.push(`+${k}${r.ot?' (OT)':''}`);else{if((o.status||'')!==(r.status||''))ch.push(`${k}: ${r.status==='ride'?'ขึ้น':r.status==='no'?'ไม่ขึ้น':'ล้าง'}`);if(!!o.back!==!!r.back)ch.push(`${k}: ${r.back?'กลับแล้ว':'ยกเลิกกลับ'}`);if(!!o.ot!==!!r.ot)ch.push(`${k}: ${r.ot?'OT':'ไม่ OT'}`)}}
      for(const k of B.keys())if(!N.has(k))ch.push(`−${k}`)}
    const d=a.what.slice(4);return `ตาราง ${+d.slice(8)}/${+d.slice(5,7)}: ${esc(ch.slice(0,6).join(' · ')||'จัดลำดับใหม่')}${ch.length>6?` …(+${ch.length-6})`:''}`}
  if(a.what.startsWith('employees/'))return `พนักงาน: ${esc((a.after||a.before||{}).name||a.what.slice(10))}${a.after?'':' (ลบ)'}`;
  if(a.what.startsWith('settings/'))return 'ตั้งค่า '+(a.what.endsWith('route')?'เส้นทาง':'ใบขอรถ');
  const del=!a.after,nm=x=>esc((x||{}).name||(x||{}).plate||'');
  if(a.what.startsWith('owner/'))return del?'ลบเจ้าของรถ '+nm(a.before):(a.after.unlink?'เลิกผูกอีเมลเจ้าของรถ':'แก้ข้อมูลเจ้าของรถ → '+nm(a.after));
  if(a.what.startsWith('vehicle/'))return del?'ลบรถ '+nm(a.before):'แก้ข้อมูลรถ → '+nm(a.after);
  if(a.what.startsWith('tenant/'))return del?('viewer' in (a.before||{})?'เอาผู้ดูของผู้เช่าออก':'ลบผู้เช่า '+nm(a.before)):'แก้ชื่อผู้เช่า → '+nm(a.after);
  if(a.what.startsWith('line/'))return del?'ลบสายถาวร '+nm(a.before):('active' in (a.after||{})?(a.after.active?'เปิดสาย':'ปิดสาย'):'แก้ชื่อสาย → '+nm(a.after));
  if(a.what.startsWith('company/'))return 'แก้ชื่อบริษัท → '+nm(a.after);
  if(a.what.startsWith('member/'))return del?'เอาทีมงานออก':'เปลี่ยนบทบาททีมงาน → '+esc(ROLE_TH[(a.after||{}).role]||'');
  if(a.what.startsWith('driver/'))return del?'ลบคนขับ '+nm(a.before):'แก้ข้อมูลคนขับ → '+nm(a.after);
  if(a.what.startsWith('months/'))return 'เดือน '+esc(a.what.slice(7));
  return esc(a.what);
}

/* ---------- 🔗 แชร์ใบขอรถเสริมให้ผู้ให้บริการรถเสริม (ต้องรัน supabase/009_share.sql) ---------- */
// ผู้อนุมัติ (แอดมินคาร์เรนท์) กดจากคำขอรถเสริมที่อนุมัติแล้ว → ได้ลิงก์ ?s=TOKEN ส่งทาง LINE
// ผู้รับเปิดลิงก์ได้ไม่ต้องล็อกอิน · ข้อมูลถูกคัดลอก ณ ตอนแชร์ · หมดอายุ/ยกเลิกได้
const SHARE_TH_M=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const SHARE_TH_D=['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
function shareUrl(tok){return location.origin+location.pathname+'?s='+encodeURIComponent(tok)}
function shareDateTH(iso){const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(iso||'');if(!m)return iso||'';const d=new Date(+m[1],+m[2]-1,+m[3]);return `${SHARE_TH_D[d.getDay()]} ${+m[3]} ${SHARE_TH_M[+m[2]-1]} ${+m[1]+543}`}
function shareWhen(t){return t?new Date(t).toLocaleString('th-TH',{dateStyle:'short',timeStyle:'short'}):''}
function shareText(d,url){const sh=d.shift==='night'?'กะดึก':'กะเช้า';
  return [`🚐 รถเสริม ${shareDateTH(d.day)} · ${sh}`,d.arrive?`ต้องถึง ${d.dest&&d.dest.name||'โรงงาน'} ก่อน ${d.arrive}`:'',`${d.riders.length} คน`,'',
    ...d.riders.map(r=>`${r.n}. ${r.name}${r.team?` (${r.team})`:''} · ${r.place||'-'} · ${r.phone||'-'}`),'',url?`แผนที่+นำทาง: ${url}`:''].filter((x,i,a)=>x||a[i-1]).join('\n')}

async function shareSheet(reqId){
  let shares=[];
  const load=async()=>{const {data,error}=await sb.from('extra_shares').select('id,token,provider,with_coords,created_at,expires_at,revoked_at,views,last_view_at,created_label').eq('request_id',reqId).order('created_at',{ascending:false});
    if(error)throw error;shares=data||[]};
  const list=()=>shares.length?shares.map(s=>{const dead=s.revoked_at||new Date(s.expires_at)<new Date();
    return `<div class="g-req ${dead?'st-cancelled':'st-approved'}"><div class="g-rh"><b>${esc(s.provider||'(ไม่ระบุผู้รับ)')}</b>${s.with_coords?' · 📍':''}<span class="g-st">${s.revoked_at?'ยกเลิกแล้ว':dead?'หมดอายุ':'ใช้ได้ถึง '+shareWhen(s.expires_at)}</span></div>
      <div class="hint">สร้าง ${shareWhen(s.created_at)} โดย ${esc(s.created_label||'')} · เปิดแล้ว ${s.views} ครั้ง${s.last_view_at?' (ล่าสุด '+shareWhen(s.last_view_at)+')':''}</div>
      ${dead?'':`<div class="g-row"><button data-copy="${esc(s.token)}">คัดลอกลิงก์</button><a class="navbtn" href="https://line.me/R/msg/text/?${encodeURIComponent(shareUrl(s.token))}" target="_blank" rel="noopener">ส่ง LINE</a><button class="danger" data-revoke="${s.id}">ยกเลิกลิงก์</button></div>`}</div>`}).join(''):'<p class="hint">ยังไม่เคยแชร์คำขอนี้</p>';
  openSheet(`<h3>🔗 แชร์ให้ผู้ให้บริการรถเสริม</h3>
   <p class="hint">ผู้รับเปิดลิงก์ได้โดยไม่ต้องล็อกอิน เห็นเฉพาะคนที่ขึ้นรถเสริม: ชื่อ เบอร์ จุดรับ และพิกัดพร้อมปุ่มนำทาง · ลิงก์เป็นข้อมูล ณ ตอนแชร์ ถ้าแก้รายชื่อทีหลังให้แชร์ใหม่</p>
   <div class="field"><label for="sh-prov">ส่งให้ (ชื่อบริษัท/คนขับรถเสริม)</label><input id="sh-prov" value="${esc((S.form&&S.form.shareProvider)||'')}" placeholder="เช่น หจก.รถตู้ใจดี / พี่สมศักดิ์"></div>
   <div class="row2"><div class="field"><label for="sh-hrs">ลิงก์ใช้ได้</label><select id="sh-hrs"><option value="12">12 ชั่วโมง</option><option value="24">1 วัน</option><option value="48" selected>2 วัน</option><option value="72">3 วัน</option><option value="168">7 วัน</option></select></div>
   <label style="display:flex;gap:8px;align-items:center;align-self:end;min-height:44px"><input type="checkbox" id="sh-ll" checked style="min-height:auto"> แนบพิกัดบ้าน + ปุ่มนำทาง</label></div>
   <p class="hint">🔒 พิกัดบ้านเป็นข้อมูลส่วนบุคคล — ส่งเฉพาะผู้ให้บริการที่ไว้ใจ และยกเลิกลิงก์เมื่อจบงาน</p>
   <div id="sh-new"></div>
   <div class="foot"><span></span><div><button class="ghost" data-act="close">ปิด</button><button class="primary" id="sh-go">สร้างลิงก์</button></div></div>
   <h3 style="margin-top:6px">ลิงก์ที่แชร์แล้ว</h3><div id="sh-list" style="display:flex;flex-direction:column;gap:8px"><p class="hint">กำลังโหลด…</p></div>`,sh=>{
    const draw=()=>{sh.querySelector('#sh-list').innerHTML=list()};
    load().then(draw,e=>{sh.querySelector('#sh-list').innerHTML=`<p class="danger">${esc(e.message)}</p>`});
    sh.querySelector('#sh-go').onclick=async ev=>{const b=ev.currentTarget;b.disabled=true;
      const prov=sh.querySelector('#sh-prov').value.trim();
      try{const r=await rpc('share_extra',{p_request:reqId,p_provider:prov||null,p_hours:+sh.querySelector('#sh-hrs').value,p_with_coords:sh.querySelector('#sh-ll').checked});
        const url=shareUrl(r.token);
        if(prov&&S.form&&S.form.shareProvider!==prov&&typeof saveDoc==='function'){S.form={...S.form,shareProvider:prov};saveDoc('settings/form',S.form)}
        sh.querySelector('#sh-new').innerHTML=`<div class="banner" style="flex-direction:column;align-items:stretch;gap:6px"><b>✓ สร้างลิงก์แล้ว — ใช้ได้ถึง ${shareWhen(r.expires_at)}</b>
          <input readonly value="${esc(url)}" id="sh-url" style="font-size:13px" aria-label="ลิงก์">
          <div class="g-row"><button class="primary" data-copy="${esc(r.token)}">คัดลอกลิงก์</button><a class="navbtn" href="https://line.me/R/msg/text/?${encodeURIComponent(url)}" target="_blank" rel="noopener">ส่ง LINE</a><a class="navbtn" href="${esc(url)}" target="_blank" rel="noopener">ดูตัวอย่าง</a></div></div>`;
        await load();draw();toast('สร้างลิงก์แล้ว');
      }catch(e){toast(isNetErr(e)?'ไม่มีเน็ต — สร้างลิงก์ไม่ได้':e.message)}finally{b.disabled=false}};
    sh.addEventListener('click',async e=>{
      const c=e.target.closest('[data-copy]'),v=e.target.closest('[data-revoke]');
      if(c){try{await navigator.clipboard.writeText(shareUrl(c.dataset.copy));toast('คัดลอกลิงก์แล้ว')}catch{const i=sh.querySelector('#sh-url');if(i){i.select();toast('กดค้างที่ลิงก์แล้วเลือกคัดลอก')}}}
      if(v){if(!v.classList.contains('armed')){v.classList.add('armed');v.textContent='กดอีกครั้งเพื่อยกเลิก';return}
        v.disabled=true;try{await rpc('revoke_extra_share',{p_id:v.dataset.revoke});await load();draw();toast('ยกเลิกลิงก์แล้ว — ผู้รับเปิดไม่ได้อีก')}catch(err){toast(err.message);v.disabled=false}}
    });
  });
}

// ---------- หน้าที่ผู้รับเปิด (?s=TOKEN) ----------
function shareBoot(){
  const tok=new URLSearchParams(location.search).get('s');if(!tok)return false;
  document.title='รถเสริม · TanKa';
  document.body.innerHTML=`<style>
:root{--bg:#f2f4f6;--surface:#fff;--ink:#16212b;--muted:#5b6977;--line:#d6dde4;--accent:#0f5c7a;--accent-ink:#fff;--bad:#b4233a}
@media (prefers-color-scheme:dark){:root{--bg:#0f151b;--surface:#17202a;--ink:#e5ecf2;--muted:#93a1ae;--line:#2b3642;--accent:#5cb8d8;--accent-ink:#06202b;--bad:#ff7b8a}}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Sukhumvit Set","Noto Sans Thai",sans-serif}
.sv a{color:var(--accent)}
.sv{max-width:720px;margin:0 auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.sv h1{font-size:20px;margin:0}.sv .sub{color:var(--muted);font-size:14px}
.sv .box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.sv .big{font-size:17px;font-weight:700}
.sv .rd{display:flex;gap:12px;align-items:flex-start}
.sv .no{flex:none;width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700}
.sv .nm{font-weight:700;font-size:16px}.sv .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.sv a.b{display:inline-flex;align-items:center;min-height:40px;padding:0 12px;border-radius:8px;border:1px solid var(--line);color:var(--ink);text-decoration:none;background:var(--surface)}
.sv a.b.p{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.sv .warn{color:var(--bad,#b4233a);font-size:13px}.sv .muted{color:var(--muted);font-size:13px}
</style><main class="sv" id="sv"><p class="sub">กำลังโหลด…</p></main>`;
  (async()=>{const root=document.getElementById('sv');
    let res;try{const {data,error}=await sb.rpc('get_extra_share',{p_token:tok});if(error)throw error;res=data}catch(e){root.innerHTML=`<div class="box"><b>เปิดลิงก์ไม่ได้</b><span class="muted">${esc(isNetErr(e)?'ไม่มีอินเทอร์เน็ต ลองใหม่อีกครั้ง':e.message)}</span></div>`;return}
    if(!res||!res.ok){root.innerHTML=`<div class="box"><b>${esc((res&&res.error)||'เปิดลิงก์ไม่ได้')}</b><span class="muted">ติดต่อผู้ที่ส่งลิงก์ให้</span></div>`;return}
    const d=res.data,sh=d.shift==='night'?'กะดึก':'กะเช้า',ll=r=>r.lat!=null&&r.lng!=null&&isFinite(r.lat)&&isFinite(r.lng)?(+r.lat).toFixed(6)+','+(+r.lng).toFixed(6):null;
    const dest=(d.dest&&d.dest.ll||'').replace(/\s+/g,'');
    const pts=d.riders.map(ll).filter(Boolean);const links=[];
    for(let i=0;i<pts.length;i+=9){const seg=pts.slice(i,i+9);const last=i+9>=pts.length;
      const to=last&&dest?dest:seg[seg.length-1],way=last&&dest?seg:seg.slice(0,-1);
      links.push('https://www.google.com/maps/dir/?api=1&travelmode=driving&destination='+encodeURIComponent(to)+(way.length?'&waypoints='+encodeURIComponent(way.join('|')):''))}
    const ev=d.extraVan||{},ct=d.contact||{};
    root.innerHTML=`<header><h1>🚐 รายชื่อรับ รถเสริม</h1><div class="sub">${esc(d.company||'')}${d.van?' · สาย '+esc(d.van):''}${res.provider?' · ส่งถึง '+esc(res.provider):''}</div></header>
      <section class="box"><span class="big">${esc(shareDateTH(d.day))} · ${sh}</span>
        ${d.arrive?`<span>ต้องถึง <b>${esc(d.dest&&d.dest.name||'โรงงาน')}</b> ก่อน <b>${esc(d.arrive)} น.</b></span>`:''}
        <span>${d.riders.length} คน${pts.length<d.riders.length?` · <span class="warn">${d.riders.length-pts.length} คนไม่มีพิกัด — โทรถามจุดรับ</span>`:''}</span>
        ${ev.plate||ev.driver?`<span class="muted">รถเสริม ${esc([ev.no,ev.plate].filter(Boolean).join(' '))}${ev.driver?' · พขร. '+esc(ev.driver):''}</span>`:''}
        ${ct.phone?`<span class="muted">ติดต่อรถหลัก: ${esc(ct.name||'')} <a href="tel:${esc(ct.phone.replace(/[^\d+]/g,''))}">${esc(ct.phone)}</a></span>`:''}
        ${links.length?`<div class="row">${links.map((u,i)=>`<a class="b p" href="${esc(u)}" target="_blank" rel="noopener">▶ นำทางทั้งเส้นทาง${links.length>1?` ช่วง ${i+1}`:''}</a>`).join('')}</div>`:''}
      </section>
      ${d.riders.map(r=>{const p=ll(r);const tel=(r.phone||'').replace(/[^\d+]/g,'');
        return `<section class="box"><div class="rd"><span class="no">${r.n}</span><div style="flex:1;min-width:0"><div class="nm">${esc(r.name)}${r.team?` <span class="muted">(${esc(r.team)})</span>`:''}</div>
          <div>${esc(r.place||'-')}</div>
          <div class="row">${tel?`<a class="b" href="tel:${esc(tel)}">📞 ${esc(r.phone)}</a>`:''}${p?`<a class="b" href="https://www.google.com/maps/search/?api=1&query=${p}" target="_blank" rel="noopener">📍 แผนที่</a><a class="b p" href="https://www.google.com/maps/dir/?api=1&travelmode=driving&destination=${p}" target="_blank" rel="noopener">นำทาง</a>`:'<span class="warn">ไม่มีพิกัด</span>'}</div></div></div></section>`}).join('')}
      <div class="row"><a class="b" href="#" id="sv-copy">คัดลอกรายชื่อ (ข้อความ)</a></div>
      <p class="muted">ลิงก์ใช้ได้ถึง ${esc(shareWhen(res.expires_at))} · ส่งโดย ${esc(res.created_label||'')} · 🔒 ข้อมูลส่วนบุคคล ใช้เพื่อรับ-ส่งพนักงานเท่านั้น ห้ามส่งต่อ</p>`;
    document.getElementById('sv-copy').onclick=async e=>{e.preventDefault();try{await navigator.clipboard.writeText(shareText(d,location.href));e.target.textContent='คัดลอกแล้ว ✓'}catch{e.target.textContent='คัดลอกไม่ได้ในเบราว์เซอร์นี้'}};
  })();
  return true;
}

function startApp(adapter){
  db=adapter;dl=DL;
  render();vanBoot();
  let gotM=false,gotE=false;const done=()=>{if(gotM&&gotE&&!S.loaded){S.loaded=true;render()}};
  db.collection('settings').onSnapshot(snap=>{const f=snap.docs.find(d=>d.id==='form');if(f&&!isBusy('settings/form'))S.form={...FORM_DEF,...clone(f.data())};
    const r=snap.docs.find(d=>d.id==='route');if(r&&!isBusy('settings/route')){S.route={...ROUTE_DEF,...clone(r.data())};solveCache.clear();render()}},()=>{});
  db.collection('employees').onSnapshot(snap=>{S.emps=snap.docs.map(d=>isBusy(`employees/${d.id}`)&&S.emps.find(x=>x.id===d.id)||({id:d.id,...clone(d.data())})).sort((a,b)=>(a.order??999)-(b.order??999));
    gotE=true;done();render()},e=>toast(e.message));
  db.collection('months').onSnapshot(snap=>{
    S.months=snap.docs.map(d=>({id:d.id,...clone(d.data())})).sort((a,b)=>b.id.localeCompare(a.id));
    if(!S.month||!S.months.some(m=>m.id===S.month)){const n=new Date();const cur=`${n.getFullYear()}-${pad(n.getMonth()+1)}`;
      selectMonth(S.months.some(m=>m.id===cur)?cur:S.months[0]?.id||null)}
    gotM=true;done();render()},e=>toast(e.message));
}
if(!shareBoot())boot();   // ?s=TOKEN → หน้ารายชื่อรถเสริมที่แชร์ (ไม่ต้องล็อกอิน)
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
